version: 2

updates:
    - package-ecosystem: 'npm'
      directory: '/'
      target-branch: 'dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 5
      labels:
          - 'deps'
      commit-message:
          prefix: 'chore'
          include: 'scope'
      ignore:
          # @typescript-eslint/parser requires typescript <6.1.0, so TypeScript 7 fails npm ci.
          # Remove once typescript-eslint supports TypeScript 7.
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']
      groups:
          eslint:
              applies-to: version-updates
              patterns:
                  - 'eslint'
                  - 'eslint-*'
                  - '@eslint/*'
                  - '@typescript-eslint/*'
          types:
              applies-to: version-updates
              patterns:
                  - '@types/*'
          tooling:
              applies-to: version-updates
              patterns:
                  - 'typescript'
                  - 'vite'
                  - 'prettier'
          minor-and-patch:
              applies-to: version-updates
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'github-actions'
      directory: '/'
      target-branch: 'dev'
      schedule:
          interval: 'monthly'
      open-pull-requests-limit: 5
      labels:
          - 'deps'
          - 'devops'
      commit-message:
          prefix: 'chore'
          include: 'scope'
